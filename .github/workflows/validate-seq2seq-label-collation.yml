name: Validate Seq2Seq array label collation
on:
  push:
    branches: [validation/seq2seq-array-label-batches-20261112]
permissions:
  contents: read
jobs:
  native-collators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify the exact reviewed source and test files
        run: git diff --exit-code 708763e7fe0c2627bf2305442bd324d571e82187 HEAD -- src tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native CPU dependencies
        run: |
          python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . 'pytest>=9,<10' pytest-xdist pytest-env parameterized psutil rich timeout-decorator accelerate datasets
      - name: Verify output, gradient and device parity on original source
        run: |
          git restore --source acf8004ec93d3d3195ea4945c693ff1c8959374e -- src/transformers/data/data_collator.py
          python -m pytest tests/trainer/test_data_collator.py -k TestDataCollatorForSeq2Seq -q -p xdist.plugin -p pytest_env.plugin
          git restore --source 708763e7fe0c2627bf2305442bd324d571e82187 -- src/transformers/data/data_collator.py
      - name: Run complete collator module including multiworker loaders
        run: python -m pytest tests/trainer/test_data_collator.py -q -p xdist.plugin -p pytest_env.plugin
      - name: Measure native Arrow DataLoader and T5 decoder preparation
        run: |
          mkdir -p validation/results
          for repeat in 1 2 3; do
            git restore --source acf8004ec93d3d3195ea4945c693ff1c8959374e -- src/transformers/data/data_collator.py
            python validation/hf_seq2seq_collation_benchmark.py --label original --output validation/results/before_${repeat}.json > validation/results/before_${repeat}.log 2>&1
            git restore --source 708763e7fe0c2627bf2305442bd324d571e82187 -- src/transformers/data/data_collator.py
            python validation/hf_seq2seq_collation_benchmark.py --label patched --output validation/results/after_${repeat}.json > validation/results/after_${repeat}.log 2>&1
          done
          python - <<'PYCODE'
          import json, statistics
          from pathlib import Path
          before = [json.loads(Path(f'validation/results/before_{i}.json').read_text()) for i in (1, 2, 3)]
          after = [json.loads(Path(f'validation/results/after_{i}.json').read_text()) for i in (1, 2, 3)]
          rows = []
          for index, row in enumerate(before[0]['results']):
              b = [run['results'][index]['median_ms'] for run in before]
              a = [run['results'][index]['median_ms'] for run in after]
              assert len({run['results'][index]['last_batch_sha256'] for run in before + after}) == 1
              rows.append(dict(shape=[row['batch_size'], row['source_length'], row['target_length']], format=row['representation'], before_ms=b, after_ms=a, before_median=statistics.median(b), after_median=statistics.median(a), reduction_pct=100*(1-statistics.median(a)/statistics.median(b))))
          summary = dict(cpu=before[0]['cpu'], parameters=before[0]['parameters'], versions={key: before[0][key] for key in ['python', 'torch', 'numpy', 'datasets', 'transformers']}, rows=rows)
          Path('validation/results/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print('BENCHMARK_SUMMARY=' + json.dumps(summary))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seq2seq-native-validation
          path: validation/results
